# Avvio: docker compose up -d --build
# Usa il MongoDB già presente su Docker Desktop (porta 27017 del PC).
name: toolpm

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Dentro un container "localhost" è il container stesso: il PC si raggiunge come host.docker.internal.
      # directConnection=true: necessario con il replica set a un nodo (docs/mongodb-replica-set.md), innocuo con un'istanza singola.
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/toolpm?directConnection=true}
      SEED_DIR: /db
      # File della migrazione dei dati del Pianificatore (blocco B7): cartella "migrazione" del progetto.
      MIGRAZIONE_DIR: /migrazione
      # Autenticazione (fase 1, blocco B2): valori da .env, vedi .env.example
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_DURATA: ${JWT_DURATA:-8h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_INIZIALE: ${ADMIN_PASSWORD_INIZIALE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # Dati di esempio, usati solo dallo script di import (scripts/seed.mjs).
      - ./db:/db:ro
      # risorse.csv, progetti.csv e password provvisorie: restano sul PC, esclusi da Git.
      - ./migrazione:/migrazione
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4201:80"
