server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Redirect relativi: nel container nginx ascolta sulla 80, ma il browser usa la porta pubblicata (4201).
  absolute_redirect off;

  # Le chiamate alle API vanno al container del backend (nome del servizio in docker-compose).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # L'app è pubblicata sotto /toolpm/ (baseHref in angular.json): la radice e /toolpm vi reindirizzano.
  location = / {
    return 302 /toolpm/;
  }
  location = /toolpm {
    return 301 /toolpm/;
  }

  # Rotte dell'app Angular: qualsiasi percorso sconosciuto sotto /toolpm/ restituisce index.html.
  location /toolpm/ {
    try_files $uri $uri/ /toolpm/index.html;
  }
}
