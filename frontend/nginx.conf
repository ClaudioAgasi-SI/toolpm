server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Le chiamate alle API vanno al container del backend (nome del servizio in docker-compose).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Rotte dell'app Angular: qualsiasi percorso sconosciuto restituisce index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
